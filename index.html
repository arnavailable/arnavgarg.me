<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arnav Garg</title>
<meta name="description" content="Arnav Garg — Analytics &amp; Business professional. SQL, Python, and decision-ready insight for Product, Data, Risk, and Business roles.">
<style>
  :root{
    --bg:#fbfaf8;
    --text:#1c1b19;
    --muted:#6b6862;
    --line:#e6e3dd;
    --accent:#8a5a3b;
    --tag-bg:#f1ede6;
    --tag-text:#5a5650;
    --max:680px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15140f;
      --text:#f2efe9;
      --muted:#a7a196;
      --line:#2c2a24;
      --accent:#e0a877;
      --tag-bg:#22201a;
      --tag-text:#c9c3b7;
    }
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    line-height:1.6;
    font-size:16px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:var(--max);
    margin:0 auto;
    padding:64px 24px 96px;
  }
  header{margin-bottom:56px;}
  h1{
    font-size:1.6rem;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .location{
    color:var(--muted);
    font-size:0.95rem;
    margin:0 0 16px;
  }
  .links{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    font-size:0.92rem;
  }
  .links a{
    color:var(--text);
    text-decoration:none;
    border-bottom:1px solid var(--line);
    padding-bottom:1px;
  }
  .links a:hover{border-color:var(--accent);color:var(--accent);}
  section{margin-bottom:52px;}
  section:empty{display:none;}
  h2{
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:0.12em;
    color:var(--muted);
    margin:0 0 20px;
    font-weight:600;
  }
  .about p{margin:0 0 14px;font-size:1.02rem;}
  .about p:last-child{margin-bottom:0;}
  .role-tags{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:18px;
  }
  .role-tag{
    font-size:0.78rem;
    background:var(--tag-bg);
    color:var(--tag-text);
    padding:4px 10px;
    border-radius:100px;
  }
  .timeline-item{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:16px;
    padding:12px 0;
    border-bottom:1px solid var(--line);
  }
  .timeline-item:last-child{border-bottom:none;}
  .timeline-role{font-weight:500;}
  .timeline-org{color:var(--muted);font-size:0.92rem;}
  .timeline-date{
    color:var(--muted);
    font-size:0.85rem;
    white-space:nowrap;
    flex-shrink:0;
  }
  .current-dot{
    display:inline-block;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--accent);
    margin-right:6px;
    position:relative;
    top:-1px;
  }
  .card{
    padding:20px 0;
    border-bottom:1px solid var(--line);
  }
  .card:last-child{border-bottom:none;}
  .card-title{
    font-weight:500;
    font-size:1.02rem;
    margin:0 0 2px;
  }
  .card-org{
    color:var(--muted);
    font-size:0.85rem;
    margin:0 0 10px;
  }
  .card ul{
    margin:0 0 12px;
    padding-left:18px;
  }
  .card li{margin-bottom:6px;font-size:0.96rem;}
  .card li:last-child{margin-bottom:0;}
  .tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{
    font-size:0.72rem;
    background:var(--tag-bg);
    color:var(--tag-text);
    padding:3px 9px;
    border-radius:100px;
  }
  .skills-grid{display:grid;gap:16px;}
  .skill-row{font-size:0.94rem;}
  .skill-label{color:var(--muted);display:block;font-size:0.78rem;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px;}
  .edu-item{margin-bottom:18px;}
  .edu-item:last-child{margin-bottom:0;}
  .edu-school{font-weight:500;}
  .edu-detail{color:var(--muted);font-size:0.9rem;}
  footer{
    color:var(--muted);
    font-size:0.85rem;
    border-top:1px solid var(--line);
    padding-top:24px;
  }
  .load-error{
    color:var(--muted);
    font-size:0.9rem;
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <p class="load-error">Loading…</p>
</div>

<script>
function el(tag, opts = {}, children = []) {
  const node = document.createElement(tag);
  if (opts.class) node.className = opts.class;
  if (opts.href) node.href = opts.href;
  if (opts.target) node.target = opts.target;
  if (opts.rel) node.rel = opts.rel;
  if (opts.text) node.textContent = opts.text;
  children.forEach(c => c && node.appendChild(c));
  return node;
}

function renderSite(data) {
  const app = document.getElementById('app');
  app.innerHTML = '';

  // Header
  const links = el('div', { class: 'links' },
    (data.links || []).map(l => el('a', { href: l.href, text: l.label, target: l.href.startsWith('http') ? '_blank' : undefined, rel: l.href.startsWith('http') ? 'noopener' : undefined }))
  );
  const header = el('header', {}, [
    el('h1', { text: data.name || '' }),
    el('p', { class: 'location', text: data.location || '' }),
    links
  ]);
  app.appendChild(header);

  // About
  if (data.about && data.about.length) {
    const aboutSection = el('section', { class: 'about' }, [
      el('h2', { text: 'About' }),
      ...data.about.map(p => el('p', { text: p })),
      el('div', { class: 'role-tags' }, (data.roleTags || []).map(t => el('span', { class: 'role-tag', text: t })))
    ]);
    app.appendChild(aboutSection);
  }

  // Experience
  if (data.experience && data.experience.length) {
    const items = data.experience.map(job => {
      const roleLine = el('div', { class: 'timeline-role' });
      if (job.current) roleLine.appendChild(el('span', { class: 'current-dot' }));
      roleLine.appendChild(document.createTextNode(job.role));
      return el('div', { class: 'timeline-item' }, [
        el('div', {}, [roleLine, el('div', { class: 'timeline-org', text: job.org })]),
        el('div', { class: 'timeline-date', text: `${job.start} – ${job.end}` })
      ]);
    });
    app.appendChild(el('section', { class: 'work' }, [el('h2', { text: 'Experience' }), ...items]));
  }

  // Highlights / Selected Work
  if (data.highlights && data.highlights.length) {
    const cards = data.highlights.map(h => el('div', { class: 'card' }, [
      el('p', { class: 'card-title', text: h.title }),
      el('p', { class: 'card-org', text: h.org }),
      el('ul', {}, (h.bullets || []).map(b => el('li', { text: b }))),
      el('div', { class: 'tags' }, (h.tags || []).map(t => el('span', { class: 'tag', text: t })))
    ]));
    app.appendChild(el('section', { class: 'highlights' }, [el('h2', { text: 'Selected Work' }), ...cards]));
  }

  // Skills
  if (data.skills && data.skills.length) {
    const rows = data.skills.map(s => el('div', { class: 'skill-row' }, [
      el('span', { class: 'skill-label', text: s.label }),
      document.createTextNode(s.items)
    ]));
    app.appendChild(el('section', { class: 'skills' }, [
      el('h2', { text: 'Skills' }),
      el('div', { class: 'skills-grid' }, rows)
    ]));
  }

  // Education
  if (data.education && data.education.length) {
    const items = data.education.map(e => el('div', { class: 'edu-item' }, [
      el('div', { class: 'edu-school', text: e.school }),
      el('div', { class: 'edu-detail', text: e.detail })
    ]));
    app.appendChild(el('section', { class: 'education' }, [el('h2', { text: 'Education' }), ...items]));
  }

  // Footer
  if (data.footer) {
    app.appendChild(el('footer', {}, [el('p', { text: data.footer })]));
  }
}

fetch('data.json')
  .then(res => {
    if (!res.ok) throw new Error('data.json not found');
    return res.json();
  })
  .then(renderSite)
  .catch(err => {
    document.getElementById('app').innerHTML =
      '<p class="load-error">Could not load site content (data.json). If you\'re opening this file directly from disk, run it through a local server instead — it works automatically once deployed on GitHub Pages.</p>';
    console.error(err);
  });
</script>
</body>
</html>
